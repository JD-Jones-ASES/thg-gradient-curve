version: v0.4
project:
  name: Sharp last-iterate bounds and extremal trajectories for constant-step gradient descent
  description: >-
    Exact final-gradient bounds for convex functions with Lipschitz gradient on
    real Hilbert spaces, under an initial-distance bound, for every horizon and
    nonnegative constant step. The factor is the maximum of reciprocal linear
    progress and the quadratic oscillation power, with genuine smooth convex
    attaining examples. The formalization includes the joint progress potential,
    complete sampled equality trajectories in both strict branches and at
    balance, and a direct transfer from actual constrained proximal minimizers
    to sharp residual and terminal objective-residual bounds. All ten principal
    declarations are listed in comparator.json; VERIFICATION.md records checks.
  authors: [JD Jones]
  responsible_maintainers: [JD Jones]
  license: MIT
classification:
  arxiv: [math.OC]
  msc2020: [90C25, 90C30, 49M37]
sources:
  - title: Last-Iterate Performance of Gradient Descent and Relaxed Proximal Point via s-Composability
    type: paper
    authors: [Salah R. Chikhi]
    relationship: adapts
    url: https://arxiv.org/html/2609.13765v1
    notes: >-
      Section 4 supplies the factorized multiplier shape and balancing-step
      starting point. The uniform divergence construction, root comparison,
      retained-surplus scaling, equality and direct proximal arguments are
      proved in this development.
  - title: Smooth Strongly Convex Interpolation and Exact Worst-case Performance of First-order Methods
    type: paper
    authors: [Adrien B. Taylor, Julien M. Hendrickx, François Glineur]
    relationship: formalizes
    url: https://arxiv.org/abs/1502.05666
    notes: >-
      Conjecture 3, smooth-convex specialization, final gradient under an
      initial-distance bound. The Huber and quadratic sharp examples are
      credited to this source. Positive strong convexity is outside this result.
automation:
  methods:
    - method: agent
      models: [OpenAI GPT-6 Astra]
      framework: OpenAI Codex
      notes: >-
        AI agents contributed mathematical arguments and extensions, Lean
        proofs, documentation and verification tooling. Disclosure.md records
        these contributions. Proof terms are kernel-checked; no external
        numerical oracle or custom axiom is a proof input.
review:
  status: agent-reviewed
  reviewers: [OpenAI GPT-6 Astra agents]
  notes: >-
    Separate collaborating agents checked the analytic transfers, uniform
    factor construction, equality and proximal arguments, and alignment of
    formal statements with their exposition. No independent human specialist
    review is claimed. See Disclosure.md and VERIFICATION.md.
fidelity:
  notes: >-
    The principal statements require actual convexity, gradients, Lipschitz
    estimates, minimizers and the literal recurrence, without assumed
    certificate feasibility. The main curve includes zero horizons, zero
    initial distance and every nonnegative step, including growth for h > 2.
    Equality concerns trajectories and sampled values. Strict-branch stability
    and general extended-real proximal existence are written supplements outside
    the ten-declaration compared contract.
